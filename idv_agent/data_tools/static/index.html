<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Data Workbench V6</title><link rel="stylesheet" href="/static/styles.css"></head>
<body>
<header><div><b>V6</b> Data Workbench <small>M29 状态引导动作标注</small></div><span id="connection">本地工作台</span></header>
<main>
<aside><div class="heading"><h2>录制工程</h2><button id="refresh">刷新</button></div><div id="sessions"></div><p class="hint">20 FPS 原始画面<br>标注 → 校验 → 训练数据</p></aside>
<article>
<section class="setup"><h1 id="title">请选择 session</h1><div id="summary" class="hint"></div><div id="readiness" class="hint"></div>
<div class="project-controls"><label>标注人<input id="reviewer" value="user"></label><label class="grow">标注工程<select id="workspace"></select></label><button id="load-project">打开工程</button><button id="reload-saved">放弃未保存修改并重载</button></div>
<details id="create-panel"><summary>准备新工程 / 导入 X-AnyLabeling</summary><div class="project-controls"><label>数据分组<input id="group" placeholder="同场景使用相同分组"></label><label>用途<select id="split"><option>train</option><option>val</option><option>test</option></select></label><label><input id="xany-complete" type="checkbox">已完成全部画面的 X-AnyLabeling 标注</label><button id="prepare">准备端点</button><button id="import">导入标注</button></div></details>
</section>
<div id="message" role="status" aria-live="polite">选择工程后开始标注，保存自动写入 CSV。</div>
<section id="editor" hidden>
<div class="editor-toolbar"><button id="previous">← 上一个</button><label class="grow">决策端点<select id="endpoints"></select></label><button id="next">下一个 →</button><button id="next-pending">下一个未完成</button><span id="progress"></span></div>
<div class="review-grid">
<div class="visual-panel"><div class="heading"><strong id="frame-caption">当前画面</strong><label><input id="show-boxes" type="checkbox" checked>显示标注框</label></div>
<div class="picture"><img id="frame-image" alt="当前标注画面"><svg id="boxes" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg></div>
<div class="frame-controls"><button id="frame-back">前一帧</button><button id="play">播放历史</button><button id="frame-forward">后一帧</button><input id="frame-range" type="range" min="0" value="0"><label>帧<input id="frame-number" type="number" min="0"></label><button id="endpoint-frame">回到端点</button></div>
<div id="history" class="history"></div><p class="hint">当前状态只参考端点及之前的画面。点击框可选择密码机目标。</p>
<div class="badges"><span id="q-label"></span><span id="saved-status"></span></div><div id="issues" class="hint"></div>
<details><summary>查看演示动作建议</summary><pre id="replay"></pre></details></div>
<form id="annotation-form" novalidate>
<h2>顶层决策与当前状态</h2><div class="fields">
<label>范围<select id="scope" data-field="scope"></select></label><label>主要阶段<select id="phase" data-field="phase"></select></label>
<label>实际正在破译<select id="decoding" data-field="decoding"></select></label><label>证据帧<input id="decoding_evidence_frames" data-field="decoding_evidence_frames" placeholder="例如 [75, 79]"></label>
</div><button id="use-evidence" type="button" class="small">将当前查看帧加入破译证据</button>
<h2>目标与局部路线</h2><div class="fields"><label>密码机候选<select id="target_candidate" data-field="target_candidate"></select></label><label>目标跟踪编号<input id="target_track_id" data-field="target_track_id" placeholder="cipher_1"></label><label>镜头方式<select id="steering" data-field="steering"></select></label><label>局部路径<select id="path" data-field="path"></select></label></div>
<h2>移动 / 镜头动作</h2><label>动作标签来源<select id="action_source" data-field="action_source"></select></label><p id="action-help" class="hint"></p>
<div id="correction" class="fields"><label>移动<select id="move" data-field="move"></select></label><label>水平镜头<select id="camera_dx" data-field="camera_dx"></select></label><label>垂直镜头<select id="camera_dy" data-field="camera_dy"></select></label></div>
<label>备注 / 纠正原因<textarea id="reason" data-field="reason" rows="2"></textarea></label>
<p class="hint">Q 已由交互提示标注生成，不受导航阶段或已按过 Q 的影响。</p>
<div class="save-bar"><button id="save-draft" type="button">保存草稿</button><button id="complete" type="button" class="primary">标注完成并下一条</button></div>
</form></div>
<section class="export-panel"><div><h2>工程校验与导出</h2><p class="hint">完整导出前检查全部端点；导出会新建版本，不覆盖原始标注。</p></div><button id="check">检查工程</button><button id="export-q">导出 Q 全帧样本</button><button id="finish" class="primary">完成工程并导出 V6</button><pre id="report"></pre></section>
</section>
</article></main><script src="/static/app.js"></script></body></html>
